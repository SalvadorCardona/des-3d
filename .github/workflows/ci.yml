name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Rejoue 2000 lancers hors navigateur : aucun dé bloqué, aucun dé hors du
      # tapis, et les six faces équiprobables au test du khi-deux.
      - run: npm run verify
        env:
          RUNS: 2000
          SEED: 1
